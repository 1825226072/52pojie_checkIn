name: 仓库定时保活

on:
  schedule:
    # 每隔 25 天的凌晨 0 点运行一次 (UTC)，保持仓库处于活跃状态
    - cron: "0 0 */25 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive_job:
    name: 保持 Actions 活跃
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 自动保活心跳提交
        run: |
          echo "Keepalive heartbeat: $(date -u)" > keepalive.txt
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add keepalive.txt
          git commit -m "chore: 定时保活自动心跳 [skip ci]" || echo "No changes"
          git push
